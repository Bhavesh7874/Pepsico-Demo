<div class="min-h-screen bg-gray-900 text-white p-8 pt-24">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold text-green-400">Admin Dashboard</h1>
            <div class="flex items-center gap-4">
              <span>Welcome, {{ user?.name }}</span>
              <button (click)="logout()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded text-white font-bold transition">Logout</button>
            </div>
        </header>

        <!-- Product Form -->
        <section class="bg-gray-800 rounded-lg p-6 shadow-lg mb-8">
            <h2 class="text-xl font-bold mb-4">Add New Product</h2>
            <form [formGroup]="productForm" (ngSubmit)="addProduct()" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" formControlName="name" placeholder="Product Name" class="p-3 rounded bg-gray-700 border border-gray-600 text-white">
                <input type="number" formControlName="price" placeholder="Price" class="p-3 rounded bg-gray-700 border border-gray-600 text-white">
                <input type="text" formControlName="description" placeholder="Description" class="p-3 rounded bg-gray-700 border border-gray-600 text-white md:col-span-2">
                <button type="submit" [disabled]="productForm.invalid" class="bg-green-600 hover:bg-green-700 px-6 py-3 rounded font-bold md:col-span-2 disabled:opacity-50">Add Product</button>
            </form>
        </section>

        <!-- Product List -->
        <section>
            <h2 class="text-2xl font-bold mb-4">Inventory</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div *ngFor="let product of products" class="bg-gray-800 p-4 rounded-lg border border-gray-700 relative group">
                    <button (click)="deleteProduct(product._id)" class="absolute top-2 right-2 bg-red-600 text-white w-8 h-8 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition">X</button>
                    <h3 class="text-xl font-bold">{{ product.name }}</h3>
                    <p class="text-green-400 font-bold text-lg">${{ product.price }}</p>
                    <p class="text-gray-400 text-sm mt-2">{{ product.description }}</p>
                    <div class="mt-4 text-xs text-gray-500">Stock: {{ product.stock }}</div>
                </div>
            </div>
        </section>
    </div>
</div>
