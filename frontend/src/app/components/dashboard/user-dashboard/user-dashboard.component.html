<div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">PepsiCo User</div>
        <nav class="nav-links">
            <a href="javascript:void(0)" class="nav-item active">
                <span class="icon">🏠</span> Home
            </a>
            <a href="javascript:void(0)" class="nav-item">
                <span class="icon">🛍️</span> My Orders
            </a>
            <a href="javascript:void(0)" class="nav-item">
                <span class="icon">⚙️</span> Settings
            </a>
        </nav>
        <button (click)="logout()" class="logout-btn">Logout</button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="header">
            <div>
                <h1 class="page-title">My Dashboard</h1>
                <p class="user-info">Manage your profile and orders</p>
            </div>
            <div class="user-pill bg-gray-800 px-4 py-2 rounded-full border border-gray-700 text-gray-300">
                Standard Member
            </div>
        </header>

        <!-- Profile Section -->
        <section class="profile-section">
            <div class="profile-header">
                <div class="avatar">👤</div>
                <div>
                    <h2 class="profile-name">{{ user?.name || 'User' }}</h2>
                    <p class="profile-email">{{ user?.email }}</p>
                </div>
            </div>
        </section>

        <!-- Quick Actions -->
        <div class="dashboard-grid">
            <div class="dashboard-card">
                <div class="card-icon">📦</div>
                <h3 class="card-title">My Orders</h3>
                <p class="card-desc">Track and view your order history</p>
            </div>
            
            <div class="dashboard-card">
                <div class="card-icon">💳</div>
                <h3 class="card-title">Payment Methods</h3>
                <p class="card-desc">Manage your saved cards</p>
            </div>

            <div class="dashboard-card">
                <div class="card-icon">❤️</div>
                <h3 class="card-title">Favorites</h3>
                <p class="card-desc">Your saved products</p>
            </div>
        </div>
    </main>
</div>
