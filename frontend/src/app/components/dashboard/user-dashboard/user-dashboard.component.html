<div class="min-h-screen text-white p-8 pt-24">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold text-blue-400">User Dashboard</h1>
            <button (click)="logout()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded text-white font-bold transition">Logout</button>
        </header>

        <section class="bg-gray-800/80 backdrop-blur-md rounded-lg p-6 shadow-lg mb-6">
            <h2 class="text-xl font-bold mb-4">Welcome, {{ user?.name }}!</h2>
            <p class="text-gray-300">You are logged in as a <strong>Standard User</strong>.</p>
            <p class="mt-2 text-gray-400">Email: {{ user?.email }}</p>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-gray-800/80 backdrop-blur-md p-6 rounded-lg text-center cursor-pointer hover:bg-gray-750 transition border border-transparent hover:border-blue-500">
                <h3 class="text-xl font-bold mb-2">My Orders</h3>
                <p class="text-sm text-gray-400">View your past Pepsico orders</p>
            </div>
            <div class="bg-gray-800/80 backdrop-blur-md p-6 rounded-lg text-center cursor-pointer hover:bg-gray-750 transition border border-transparent hover:border-blue-500">
                <h3 class="text-xl font-bold mb-2">Profile Settings</h3>
                <p class="text-sm text-gray-400">Update your account details</p>
            </div>
        </div>
    </div>
</div>
