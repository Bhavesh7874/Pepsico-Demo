<div class="min-h-screen flex items-center justify-center bg-transparent text-white pt-20">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-md border border-gray-700">
        <h2 class="text-3xl font-bold mb-6 text-center text-blue-500">PEPSICO Login</h2>
        
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="mb-4">
                <label class="block mb-2 text-sm font-bold">Email</label>
                <input type="email" formControlName="email" class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">
            </div>

            <div class="mb-6">
                <label class="block mb-2 text-sm font-bold">Password</label>
                <input type="password" formControlName="password" class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">
            </div>

            <div *ngIf="error" class="mb-4 text-red-500 text-sm text-center">
                {{ error }}
            </div>

            <button type="submit" [disabled]="loading" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition duration-200">
                {{ loading ? 'Logging in...' : 'Login' }}
            </button>
        </form>

        <div class="mt-4 text-center text-sm">
            <span class="text-gray-400">Don't have an account? </span>
            <a routerLink="/register" class="text-blue-400 hover:text-blue-300">Register here</a>
        </div>
    </div>
</div>
