<div id="pepsi-register-root" class="min-h-screen w-full flex items-center justify-center bg-transparent relative overflow-hidden pt-24">
    <!-- 3D Scene is visible due to transparent background -->
    
    <div class="register-card p-10 md:p-14 w-full max-w-lg mx-auto relative z-10 glass-panel">
        <div class="logo-container mb-10">
            <div class="logo-icon"></div>
            <h1 class="logo-text">PepsiCo</h1>
        </div>
        
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <div *ngIf="error" class="error-message">
                {{ error }}
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" formControlName="name" class="form-input" placeholder="Your Name">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" formControlName="email" class="form-input" placeholder="name@pepsico.com">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" formControlName="password" class="form-input" placeholder="••••••••">
            </div>

            <button type="submit" [disabled]="loading" class="btn-primary">
                {{ loading ? 'Creating Account...' : 'Register' }}
            </button>
        </form>

        <div class="login-link mt-8">
            <span>Already have an account? </span>
            <a routerLink="/login">Sign In</a>
        </div>
    </div>
</div>
